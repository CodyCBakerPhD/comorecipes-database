instructions:
- Whisk olive oil, vinegar, adobo, tomato sauce, and salt. Toss with tofu and marinate for 1 hour.
- Bake tofu on parchment at 400 F for 30 minutes.
- Saute onion until browned, then add garlic, adobo, and tomato paste and cook for 2-3 minutes.
- Add rice, water, and salt. Cover and simmer for about 20 minutes.
- Warm tortillas and fill with tofu, rice, and garnishes.

notes:
- Leftover tofu is also good stuffed into a burrito, crumbled onto a tostada, or in a rice bowl.
