name: Applesauce

tags:
- American
- Dessert
- Side
- Vegetarian
- Fruit

measurements:
- amount: '4'
  unit: portions
  ingredient: red apple
- amount: '180'
  unit: grams
  ingredient: water
- amount: '12'
  unit: grams
  ingredient: sugar
- amount: '14'
  unit: grams
  ingredient: brown sugar
- amount: '1'
  unit: grams
  ingredient: cinnamon

instructions:
- Peel and core apples.
- Combine everything and cook over medium heat for 15-20 minutes (until apples are soft).
- Allow to cool, then mash with fork or potato masher.
