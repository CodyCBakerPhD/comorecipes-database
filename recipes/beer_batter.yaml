name: Beer Batter

tags:
- American
- Vegetarian
- Entree

measurements:
- amount: '240'
  unit: grams
  ingredient: flour
- amount: '40'
  unit: grams
  ingredient: cornstarch
- amount: '6'
  unit: grams
  ingredient: salt
- amount: '3'
  unit: grams
  ingredient: paprika
- amount: '14'
  unit: grams
  ingredient: baking powder
- amount: '4'
  unit: portions
  ingredient: beer

instructions:
- Whisk dry ingredients.
- Add beer and incorporate.
- Mixture should feel like pancake batter.
- Cook 2-3 minutes per side in 375 F oil.
