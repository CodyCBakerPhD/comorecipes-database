name: Brigadeiros

tags:
- Brazilian
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '54'
  unit: grams
  ingredient: Dutch cocoa powder
- amount: '14'
  unit: grams
  ingredient: butter
- amount: '400'
  unit: grams
  prefix: (14 oz)
  ingredient: condensed milk
- amount: 'enough'
  ingredient: chocolate sprinkles

instructions:
- Combine cocoa, butter, and condensed milk in a medium saucepan over medium heat.
- Cook and stir until thickened, about 10 minutes.
- Remove from heat and let rest until just cool enough to handle.
- Form into small balls and coat with sprinkles.
