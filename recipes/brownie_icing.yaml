name: Brownie Icing

tags:
- American
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '18'
  unit: grams
  ingredient: Dutch cocoa powder
- amount: '38'
  unit: grams
  ingredient: butter
- amount: '29'
  unit: grams
  ingredient: powdered sugar
- amount: '9'
  unit: grams
  ingredient: evaporated milk
- amount: '2'
  unit: grams
  ingredient: vanilla

notes:
  - DO NOT FORGET to sift all dry ingredients.

instructions:
- Do not forget to sift dry ingredients.
- Melt butter in saucepan. Add sifted cocoa and remove pan from heat.
- Stir in sifted powdered sugar and other ingredients, saving vanilla for last to keep it smooth.
- Add more powdered sugar as necessary for consistency.
