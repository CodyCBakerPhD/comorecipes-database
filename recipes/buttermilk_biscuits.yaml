name: Buttermilk Biscuits

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '50'
  unit: grams
  ingredient: butter
- amount: '145'
  unit: grams
  ingredient: flour
- amount: '6'
  unit: grams
  ingredient: baking powder
- amount: '1'
  unit: grams
  ingredient: baking soda
- amount: '2.5'
  unit: grams
  ingredient: salt
- amount: '100'
  unit: grams
  ingredient: buttermilk

notes:
- Freeze butter ahead of time.

instructions:
- Preheat to 425 F.
- Whisk dry ingredients together.
- Crumble butter with dry mixture.
- Gently mix in buttermilk.
- When mixed together, transfer to cutting board.
- Roll out and do 3 envelope folds.
- Roll to half inch thickness and cut into biscuits.
- Bake for 15 minutes.
