name: Buttermilk Waffles

tags:
- American
- Breakfast
- Vegetarian

measurements:
- amount: '35'
  unit: grams
  prefix: melted and cooled
  ingredient: butter
- amount: '1'
  unit: portions
  ingredient: egg
- amount: '112'
  unit: grams
  ingredient: buttermilk
- amount: '1'
  unit: grams
  ingredient: vanilla
- amount: '60'
  unit: grams
  ingredient: flour
- amount: '3'
  unit: grams
  ingredient: baking powder
- amount: '2'
  unit: grams
  ingredient: baking soda
- amount: '2'
  unit: grams
  ingredient: sugar
- amount: '1'
  unit: grams
  ingredient: salt
- amount: '12'
  unit: grams
  ingredient: pearl sugar

notes:
- Waffle will be best if all ingredients are at room temperature.

instructions:
- Heat waffle iron.
- In a large bowl, combine all dry ingredients.
- Create a depression for the buttermilk mixture.
- Beat the eggs in a large measuring cup until frothy.
- Add vanilla extract, buttermilk, and cooled melted butter.
- Beat until well combined.
- Pour into the depression and stir quickly but gently with a wooden spoon.
- Gently incorporate pearl sugar.
- Use about a quarter of batter per waffle.
- Cook until steam stops rising from the iron.
