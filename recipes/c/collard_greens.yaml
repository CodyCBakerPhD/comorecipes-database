name: Collard Greens

tags:
- American
- Side
- Vegetarian
- Spicy

measurements:
- amount: 'enough'
  ingredient: extra virgin olive oil
- amount: '250'
  unit: grams
  prefix: chopped
  ingredient: white onion
- amount: '10'
  unit: grams
  prefix: minced
  ingredient: garlic
- amount: '8'
  unit: grams
  ingredient: salt and ground black pepper
- amount: '360'
  unit: grams
  ingredient: no-chicken stock
- amount: '1'
  unit: grams
  ingredient: red pepper flakes
- amount: '1'
  unit: portions
  ingredient: collard greens

instructions:
- Heat oil in very large pot over medium heat.
- Add onion, cook until tender.
- Add garlic.
- Add collard greens, fry until they wilt.
- Pour in broth, season with spices.
- Reduce heat to low, cover, and simmer for 45 minutes or until tender.
