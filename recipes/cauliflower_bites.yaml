name: Cauliflower Bites

tags:
- Vegetarian
- Entree
- Spicy

measurements:
- amount: '90'
  unit: grams
  ingredient: flour
- amount: '30'
  unit: grams
  ingredient: cornstarch
- amount: '3'
  unit: grams
  ingredient: salt and pepper
- amount: '2'
  unit: grams
  ingredient: garlic powder
- amount: '240'
  unit: grams
  ingredient: water
- amount: '1'
  unit: portions
  ingredient: cauliflower
- amount: '120'
  unit: grams
  ingredient: hot sauce
- amount: '57'
  unit: grams
  ingredient: butter

instructions:
- Preheat oven to 450 F.
- Line baking sheet with foil.
- Whisk flour, cornstarch, salt, pepper, and garlic powder in a bowl.
- Whisk in water until smooth.
- Add cauliflower and toss to coat.
- Bake 25 minutes or until lightly browned.
- Combine hot sauce and butter in a small saucepan; heat until melted together.
- Toss cauliflower in sauce and bake another 5 minutes to seal glaze.
