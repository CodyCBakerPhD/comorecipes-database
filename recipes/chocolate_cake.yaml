instructions:
- Preheat to 350 F. Spray pan.
- Add all dry ingredients and mix.
- Boil water.
- Add non-water wet ingredients and mix until well combined.
- Reduce speed and carefully add boiling water and mix well.
- Immediately transfer mixture to pan and bake for 30-35 minutes.
- For cupcakes, only fill to a little over the halfway point to avoid spillage.
