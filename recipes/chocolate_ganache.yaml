name: Chocolate Ganache

tags:
- American
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '340'
  unit: grams
  ingredient: semi-sweet chocolate
- amount: '120'
  unit: grams
  ingredient: cream
- amount: '2'
  unit: grams
  ingredient: vanilla

instructions:
- Combine chocolate and heavy cream in a small saucepan over medium heat.
- Stir frequently until chocolate is melted and mixture is smooth.
- Remove from heat, stir in vanilla extract.
- Allow chocolate to cool slightly, about 5 minutes.
