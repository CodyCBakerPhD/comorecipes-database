name: Cinnabon Icing

tags:
- Component

measurements:
- amount: '50'
  unit: grams
  ingredient: cream cheese
  suffix: ', room temperature'
- amount: '35'
  unit: grams
  ingredient: butter
  suffix: ', room temperature'
- amount: '60'
  unit: grams
  ingredient: powdered sugar
- amount: '1.5'
  unit: grams
  ingredient: vanilla
- amount: '1.5'
  unit: grams
  ingredient: lemon juice

instructions:
- Combine butter and cream cheese in stand mixer.
- Continually sift in powdered sugar.
- Beat for about ten minutes until light and fluffy.
- Add vanilla and lemon juice until incorporated.
