name: Cobbler Topping

tags:
- American
- Dessert
- Vegetarian

measurements:
- amount: '76'
  unit: grams
  ingredient: unsalted butter
- amount: '33'
  unit: grams
  ingredient: granulated white sugar
- amount: '36'
  unit: grams
  ingredient: light brown sugar
- amount: '1'
  unit: portions
  ingredient: egg
- amount: '1'
  unit: grams
  ingredient: vanilla extract
- amount: '30'
  unit: grams
  ingredient: all-purpose flour
- amount: '0.5'
  unit: grams
  ingredient: baking powder
- amount: '1'
  unit: grams
  ingredient: salt

notes:
- Mixture will be quite wet, not doughy. Do not add too much flour or else it will be cakey.

instructions:
- Cream butter and sugar until light and fluffy.
- Mix flour, baking powder, and salt in separate bowl.
- Slowly incorporate flour mixture into butter mixture, until just combined.
- Drop spoonfuls onto wet mixture.
- Bake for 35 min at 375 F.
