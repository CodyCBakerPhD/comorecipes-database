name: Cornbread

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '57'
  unit: grams
  ingredient: unsalted butter
- amount: '33'
  unit: grams
  ingredient: granulated white sugar
- amount: '1'
  unit: portions
  ingredient: egg
- amount: '112'
  unit: grams
  ingredient: buttermilk
- amount: '1.5'
  unit: grams
  ingredient: baking soda
- amount: '60'
  unit: grams
  ingredient: cornmeal
- amount: '60'
  unit: grams
  ingredient: all-purpose flour
- amount: '1'
  unit: grams
  ingredient: salt

instructions:
- Preheat to 375 F.
- Melt butter.
- Stir in sugar.
- Add eggs, beat.
- Combine buttermilk and soda, stir into mixture.
- Add remaining ingredients, stir until blended.
- Bake for about 20 minutes, until slightly brown on top.
