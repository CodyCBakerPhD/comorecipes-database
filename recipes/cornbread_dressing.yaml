name: Cornbread Dressing

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '2'
  unit: portions
  ingredient: cornbread
  recipe: cornbread
- amount: '28'
  unit: grams
  ingredient: unsalted butter
- amount: '2'
  unit: portions
  ingredient: celery
- amount: '75'
  unit: grams
  ingredient: white onion
- amount: '480'
  unit: grams
  ingredient: no-chicken stock
- amount: '4'
  unit: grams
  ingredient: dried ground sage
- amount: '5'
  unit: grams
  ingredient: salt and ground black pepper

instructions:
- Make cornbread 1-2 days in advance, crumble and leave to dry.
- Melt butter and saute celery and onion until soft.
- Combine with cornbread.
- If not stuffing into turkey, then incorporate stock and spices.
- If stuffing, only incorporate the spices.
- Bake for 30 minutes at 350 F.
