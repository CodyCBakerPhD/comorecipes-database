name: Cream Fudge

tags:
- American
- Dessert
- Vegetarian
- Christmas

measurements:
- amount: '100'
  unit: grams
  ingredient: sugar
- amount: '47'
  unit: grams
  ingredient: whole milk
- amount: '5.5'
  unit: grams
  ingredient: light corn syrup
- amount: '42.5'
  unit: grams
  ingredient: condensed milk
- amount: '19'
  unit: grams
  ingredient: butter

instructions:
- Butter heat-proof pan.
- Combine sugar and whole milk into a large saucepan.
- Add condensed milk, corn syrup, and butter.
- Heat over medium-high heat for approximately 15 minutes, stirring constantly.
- Target temperature is 240 F, which should be thick and caramelized.
- Remove from heat and carefully transfer to a stand mixer bowl.
- Contents will be very hot, so be careful.
- Carefully beat with scraper attachment (and shield) on lowest speed until no longer shiny, about 4 minutes.
- Pour fudge onto prepared pan and let cool.

notes:
- Constantly stir to avoid any amount of burning.
