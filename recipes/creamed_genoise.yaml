name: Creamed Genoise

tags:
- British
- Dessert
- Vegetarian

measurements:
- amount: '188'
  unit: grams
  prefix: room temperature
  ingredient: butter
- amount: '188'
  unit: grams
  ingredient: sugar
- amount: '3'
  unit: portions
  ingredient: egg
  suffix: ', room temperature'
- amount: '187'
  unit: grams
  ingredient: cake flour
- amount: '2'
  unit: grams
  ingredient: baking powder
- amount: '25'
  unit: grams
  ingredient: milk
- amount: '4'
  unit: grams
  ingredient: vanilla

instructions:
- Preheat to 350 F.
- Cream butter and sugar with wooden spoon.
- Set in stand mixer on medium-high for about two minutes, constantly scraping the sides.
- Begin adding very small drizzle of the egg into the butter mixture while it remains in the stand mixer on medium-high.
- Continue until all egg is incorporated.
- Remove from stand mixer and over the course of several gentle folds, sift and incorporate the flour and baking powder.
- Halfway through the folding, add half the milk/vanilla mixture.
- Add remaining at the end.
- Bake for around 20 minutes.
