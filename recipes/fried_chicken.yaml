name: Fried Chicken

tags:
- American
- Entree

measurements:
- amount: '0.25'
  unit: portions
  ingredient: frying breading
  recipe: frying_breading
- amount: '2'
  unit: portions
  ingredient: chicken breasts
- amount: '450'
  unit: grams
  ingredient: buttermilk

instructions:
- Heat oil to 325 F. Add some lime juice if feeling fruity.
- Cut each chicken breast in half and soak in buttermilk for a few minutes.
- Dredge with breading in a plastic bag for maximum cleanliness and adherence.
- Fry for ~13 minutes until golden brown, crispy, and thickest part of meat is 180
  F.
