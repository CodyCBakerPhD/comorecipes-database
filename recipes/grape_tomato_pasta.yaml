name: Grape Tomato Pasta

tags:
- Italian
- Vegetarian
- Entree

measurements:
- amount: '1'
  unit: portions
  ingredient: fresh angel hair pasta
- amount: 'enough'
  ingredient: olive oil
- amount: '8'
  unit: grams
  ingredient: garlic
- amount: '298'
  unit: grams
  ingredient: grape tomatoes
- amount: '3'
  unit: grams
  ingredient: salt
- amount: '2'
  unit: grams
  ingredient: red pepper flakes
- amount: '5'
  unit: grams
  prefix: sliced
  ingredient: fresh basil
- amount: '30'
  unit: grams
  ingredient: lemon juice

notes:
- Some seared scallops on the side are a great addition to this dish.

instructions:
- Cook pasta.
- Heat olive oil in a large skillet over medium heat.
- Add garlic and cook while stirring for ~1 minute.
- Add grape tomatoes, salt, and red pepper flakes.
- Cook until tomatoes are soft and start to burst, ~6 minutes.
- Remove from heat and stir in basil and lemon juice.
- Toss with cooked pasta and serve.
