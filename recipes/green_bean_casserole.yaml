name: Green Bean Casserole

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '2'
  unit: portions
  ingredient: cans of French-style green beans
- amount: '1'
  unit: portions
  ingredient: can of cream of mushroom soup
- amount: '1'
  unit: portions
  ingredient: can French-fried onions
- amount: '125'
  unit: grams
  ingredient: milk
- amount: '2'
  unit: grams
  ingredient: salt and pepper

instructions:
- Drain green beans. Mix soup, milk, pepper in a bowl. Add beans and mix together.
  Add half of the onions, give a quick stir.
- Place in casserole dish and bake for 25 minutes at 350 F. Add remaining onions to
  top and bake another 5 minutes, keeping close watch for burning.
