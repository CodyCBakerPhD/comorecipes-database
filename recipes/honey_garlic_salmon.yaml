instructions:
- Move oven shelf to middle.
- Preheat to broil settings on medium heat.
- Season salmon with salt, pepper, paprika. Set aside.
- Heat butter in a skillet over medium-high heat until melted.
- Add garlic and saute for a minute.
- Pour in honey, water, and soy sauce.
- Allow flavors to heat through.
- Add lemon juice, stir well to combine.
- Add the salmon to the sauce in the pan, cook each fillet for 3-4 minutes or until golden.
- Baste the tops with the pan juices.
- Season with salt and pepper to taste. Add lemon wedges around salmon if desired.
- Baste salmon one more time, transfer pan to the oven to broil for 5-6 minutes.
- To serve, drizzle with sauce and a squeeze of lemon juice.
