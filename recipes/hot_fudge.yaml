name: Hot Fudge

tags:
- American
- Dessert

measurements:
- amount: '113'
  unit: grams
  ingredient: semi-sweet chocolate
- amount: '75'
  unit: grams
  ingredient: sugar
- amount: '120'
  unit: grams
  ingredient: cream
- amount: '80'
  unit: grams
  ingredient: corn syrup
- amount: '18'
  unit: grams
  ingredient: Dutch cocoa powder
- amount: '0.5'
  unit: grams
  ingredient: salt
- amount: '4'
  unit: grams
  ingredient: vanilla
- amount: '28'
  unit: grams
  ingredient: butter

instructions:
- Whisk all ingredients except vanilla and butter thoroughly in a saucepan.
- Bring to boil for 3 minutes, stirring constantly.
- Achieve a temperature of 220 F, then remove from heat.
- Add vanilla and butter and stir until smooth.
- Keep in sealed container, reheating as necessary.
