name: Kaiser Roll

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '240'
  unit: grams
  ingredient: water
- amount: '17'
  unit: grams
  ingredient: active dry yeast
- amount: '4'
  unit: grams
  ingredient: granulated white sugar
- amount: '36'
  unit: grams
  ingredient: vegetable oil
- amount: '3'
  unit: grams
  ingredient: salt
- amount: '240'
  unit: grams
  ingredient: all-purpose flour

instructions:
- Preheat oven to 400 F. Activate yeast.
- Mix in oil and flour and salt until good consistency. Roll out into shape (make
  sure the rolls are appropriately sized for rising) and let rise for 40 minutes.
- Top with egg white and water mixture, bake for 15 minutes.

notes:
- Honey may be substituted in place of sugar
