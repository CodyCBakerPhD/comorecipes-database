name: Macaroni And Cheese

tags:
- American
- Vegetarian
- Entree
- Pasta

measurements:
- amount: '227'
  unit: grams
  ingredient: cavatappi
- amount: '45'
  unit: grams
  ingredient: butter
- amount: '30'
  unit: grams
  ingredient: flour
- amount: '480'
  unit: grams
  ingredient: milk
- amount: '200'
  unit: grams
  ingredient: English aged cheddar
- amount: '3'
  unit: grams
  ingredient: salt and pepper
- amount: '0.5'
  unit: grams
  ingredient: paprika

notes:
- Any combination of between 2% milk (for thin consistency) and heavy cream (very thick texture) may be used.

instructions:
- Cook pasta ahead of time. Cut 75% of cheese into small cubes or shred. Shred remaining
  25%.
- Melt butter and slowly whisk in flour. Do not cook too much.
- Slowly whisk in milk or cream. When mixture is warm, thoroughly melt 75% of cheese.
- Season.
- Mix pasta into mixture. Layer into dish, sprinkling remaining 25% of cheese across
  layers, leaving some for the top.
- Bake for 15 minutes at 325 F; optionally, broil the top for added flavor and texture.
