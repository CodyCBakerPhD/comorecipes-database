name: Mirror Glaze

tags:
- Vegetarian
- Dessert
- Chocolate

measurements:
- amount: '20'
  unit: grams
  ingredient: Agar Agar
- amount: '170'
  unit: grams
  ingredient: water
- amount: '300'
  unit: grams
  ingredient: corn syrup
- amount: '150'
  unit: grams
  ingredient: sugar
- amount: '200'
  unit: grams
  ingredient: condensed milk
- amount: '300'
  unit: grams
  ingredient: white chocolate

instructions:
- Divide water in two.
- Place Agar Agar in one of the two halves and let sit for 4 minutes.
- In a large saucepan - add corn syrup, condensed milk, and remaining water over low
  to medium heat.
- Bring to slow boil, ensuring sugar has dissolved.
- Take saucepan off heat, let rest 1 minute before adding white chocolate to mixture.
- Add Agar Agar and let mixture melt.
- Stir and allow glaze to come to room temperature.
