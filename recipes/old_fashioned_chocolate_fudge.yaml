name: Old Fashioned Chocolate Fudge

tags:
- American
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '600'
  unit: grams
  ingredient: sugar
- amount: '57'
  unit: grams
  ingredient: Dutch cocoa powder
- amount: '0.5'
  unit: grams
  ingredient: salt
- amount: '366'
  unit: grams
  ingredient: whole milk
- amount: '57'
  unit: grams
  ingredient: butter
- amount: '4'
  unit: grams
  ingredient: vanilla

instructions:
- Butter heat-proof pan.
- Combine sugar, cocoa, and salt.
- Combine with milk.
- While stirring constantly, heat over medium heat until strong boil, approximately
  15 minutes.
- Lower heat to medium-low and cook approximately 30 more minutes.
- Target temperature is 250 F.
- Remove from heat and add butter and vanilla.
- Carefully transfer to a stand mixer bowl.
- Contents will be very hot, so be careful.
- Carefully beat with scraper attachment (and shield) on lowest speed until no longer
  shiny, about 6 minutes.
- Pour fudge onto prepared pan and let cool.

notes:
- Constantly stir to avoid any amount of burning.
