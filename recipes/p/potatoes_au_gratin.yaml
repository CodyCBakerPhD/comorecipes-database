name: Potatoes Au Gratin

tags:
- French
- Vegetarian
- Entree

measurements:
- amount: '4'
  unit: portions
  ingredient: potatoes
- amount: '250'
  unit: grams
  prefix: sliced
  ingredient: white onion
- amount: '4'
  unit: grams
  ingredient: salt and ground black pepper
- amount: '42'
  unit: grams
  ingredient: unsalted butter
- amount: '24'
  unit: grams
  ingredient: all-purpose flour
- amount: '500'
  unit: grams
  ingredient: whole milk
- amount: '180'
  unit: grams
  ingredient: cheddar

instructions:
- Preheat to 400 F. Butter the casserole dish.
- Thoroughly scrub the potatoes, skins on.
- Layer half of potatoes into bottom of dish. Top with onions and add remaining potatoes.
  Season with salt and pepper.
- In medium-sized pan, melt butter over medium heat. Mix in flour and salt. Stir constantly
  with whisk for 1 minute. Stir in milk.
- Cook until thickened, then stir in cheese all at once.
- Continue stirring until melted, about 30 to 60 seconds. Pour cheese over potatoes
  and cover with dish with aluminum foil. Bake 90 minutes.
