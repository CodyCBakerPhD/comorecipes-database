name: Pizza Crust

tags:
- American
- Vegetarian
- Entree

measurements:
- amount: '240'
  unit: grams
  ingredient: water
- amount: '17'
  unit: grams
  ingredient: yeast
- amount: '4'
  unit: grams
  ingredient: sugar or honey
- amount: '255'
  unit: grams
  ingredient: flour
- amount: '6'
  unit: grams
  ingredient: salt

notes:
- "WARNING: Do not attempt to substitute any flour for whole wheat."

instructions:
- Activate yeast. Mix in flour and salt until good consistency. Knead for 3 minutes.
  Place in oiled rising container. Set timer for 40 minutes and let rise in warm spot.
- Preheat oven to 400 F. Press into shape and top. Brush sides with truffle oil and
  seasoning. Bake for around 13 minutes.
