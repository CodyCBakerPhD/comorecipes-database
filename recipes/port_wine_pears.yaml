name: Port Wine Pears

tags:
- European
- Dessert

measurements:
- amount: '4'
  unit: portions
  ingredient: pears
- amount: '1'
  unit: portions
  ingredient: bottle of ruby port
- amount: '50'
  unit: grams
  ingredient: sugar
- amount: '55'
  unit: grams
  ingredient: brown sugar
- amount: '2'
  unit: portions
  ingredient: cinnamon sticks
- amount: '1'
  unit: portions
  ingredient: star anise
- amount: '4'
  unit: portions
  ingredient: whole cloves
- amount: '2'
  unit: grams
  ingredient: nutmeg
- amount: '4'
  unit: grams
  ingredient: vanilla
- amount: '1'
  unit: portions
  ingredient: lemon zest
- amount: '1'
  unit: portions
  ingredient: orange zest
- amount: '3'
  unit: grams
  ingredient: salt and pepper

instructions:
- Combine all ingredients except pears in a saucepan.
- Simmer gently for 7 minutes.
- Peel and core pears.
- Drop pears into liquid and simmer for at least 45 minutes, turning every so often, until they are very soft.
