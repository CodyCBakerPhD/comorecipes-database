name: Roast Pumpkin

tags:
- American
- Vegetarian

measurements:
- amount: '1'
  unit: portions
  ingredient: sugar pumpkin
- amount: 'enough'
  ingredient: coconut oil

instructions:
- Cut pumpkin in half length-wise. Scrape out seeds and string.
- Brush with oil and pierce outer skin a few times for steam to escape. Bake for 45-50
  minutes at 350 F. Let cool and then scoop out meat.
