name: Ramen

tags:
- Asian
- Vegetarian
- Entree

measurements:
- amount: '3'
  unit: portions
  ingredient: ramen noodles
- amount: '500'
  unit: grams
  ingredient: no-chicken stock
- amount: '200'
  unit: grams
  ingredient: onion
- amount: '0.5'
  unit: portions
  ingredient: cabbage
- amount: '100'
  unit: grams
  ingredient: Shiitake mushrooms
- amount: '50'
  unit: grams
  ingredient: water
- amount: '10'
  unit: grams
  ingredient: soy sauce
- amount: '5'
  unit: grams
  ingredient: red pepper flakes


instructions:
- Boil water and cook ramen noodles separately. Drain and rinse with cool water.
- Cook onion until softened.
- Add cabbage, mushroom, and other vegetables. Cook until soft.
- Add a splash of no-chicken stock to deglaze the bottom of the pot.
- Continue adding no-chicken stock, water, soy sauce, and red pepper flakes. Bring to simmer, cook for 5 minutes.
- Add ramen noodles to broth.
