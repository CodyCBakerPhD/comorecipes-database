name: Royal Icing

tags:
- Vegetarian
- Dessert

measurements:
- amount: '1'
  unit: portions
  ingredient: egg white
- amount: '150'
  unit: grams
  ingredient: sugar
- amount: '2.8'
  unit: grams
  ingredient: light corn syrup
- amount: '80'
  unit: grams
  prefix: cold
  ingredient: water
- amount: '1'
  unit: grams
  ingredient: salt
- amount: '4'
  unit: grams
  ingredient: vanilla

instructions:
- Combine all ingredients except vanilla in top of double boiler.
- Beat at high speed while cooking until peaks form, ~8 minutes.
- Remove from heat and add vanilla.
