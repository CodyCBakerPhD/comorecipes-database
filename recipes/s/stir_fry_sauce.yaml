name: Stir Fry Sauce

tags:
- Asian
- Vegetarian
- Component

measurements:
- amount: '64'
  unit: grams
  ingredient: low-sodium soy sauce
- amount: '60'
  unit: grams
  ingredient: low-sodium vegetable stock
- amount: '2.25'
  unit: grams
  ingredient: sesame oil
- amount: '3.75'
  unit: grams
  ingredient: rice vinegar
- amount: '5'
  unit: grams
  prefix: minced
  ingredient: garlic
- amount: '0.25'
  unit: grams
  ingredient: dried ground ginger
- amount: '6.25'
  unit: grams
  ingredient: sugar or honey
- amount: '4'
  unit: grams
  ingredient: cornstarch
- amount: '0.25'
  unit: grams
  ingredient: red pepper flakes

instructions:
- In a bowl or a jar with a lid, whisk or shake all of the ingredients until combined.
- Use immediately in a stir fry, simmering the sauce to thicken it, or store in an airtight container in the fridge for up to 1 week.

notes:
- 'To make extra sweet: add up to 6.25 grams more sugar or honey.'
- 'To make extra sour: add up to 3.75 grams more rice vinegar.'
