name: Sauteed Green Beans

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '900'
  unit: grams
  ingredient: green beans
- amount: 'enough'
  ingredient: olive oil
- amount: 'enough'
  ingredient: salt and pepper

instructions:
- Coat the bottom of a cast iron skillet with olive oil. Warm oil at medium heat.
- Add green beans, stirring to coat with olive oil.
- Add salt and pepper to taste, and stir again.
- Cover cast iron skillet with a lid, and cook for approximately 8 minutes, stirring
  occasionally.
- When green beans are crisping on the outside, reduce heat to low and continue cooking
  for ~5 minutes.
