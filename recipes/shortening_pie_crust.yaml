name: Shortening Pie Crust

tags:
- American
- Dessert
- Vegetarian

measurements:
- amount: '8'
  unit: grams
  ingredient: sugar
- amount: '270'
  unit: grams
  ingredient: flour
- amount: '3'
  unit: grams
  ingredient: salt
- amount: '190'
  unit: grams
  prefix: cold
  ingredient: shortening
- amount: '120'
  unit: grams
  prefix: ice
  ingredient: water
- amount: '1'
  unit: portions
  ingredient: egg yolk
  suffix: with a little water

instructions:
- Pulse flour, sugar and salt in food processor to combine. Add cold shortening and
  pulse until pea-size pieces remain.
- Transfer to bowl and cover, refrigerate for at least 30 minutes. Drizzle ice water
  over mixture and mix thoroughly with hands.
- Divide in half, press into discs and store back in the refrigerator for at least
  1 hour.
- Preheat to 350 F. Move discs into pie tin. Shape and add filling, then top. Seal
  joint and add air-holes in the top. Brush top with egg yolk and water mixture, not
  overdoing it.
- Bake for 90 to 100 minutes for fruit pies.
