name: Simple Chocolate Fudge

tags:
- American
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '453'
  unit: grams
  ingredient: powdered sugar
- amount: '92'
  unit: grams
  ingredient: Dutch cocoa powder
- amount: '113'
  unit: grams
  ingredient: butter
- amount: '60'
  unit: grams
  ingredient: chocolate milk
- amount: '17'
  unit: grams
  ingredient: vanilla

instructions:
- One of several variations on chocolate fudge.
- Line a 6 x 8 pan with parchment paper misted very lightly with cooking spray.
- Sift powdered sugar and cocoa powder. Cube butter into 1 inch chunks.
- Pour an inch or two of water into a saucepan, then bring to a simmer.
- Place powdered sugar, cocoa powder, butter, and milk into a large bowl, then place
  the bowl on top of the saucepan with simmering water.
- Cook, whisking regularly, until the butter has melted, and the mixture is smooth.
- Remove from heat, stir in the vanilla, then pour quickly into prepared pan.
- Chill until solidified.
