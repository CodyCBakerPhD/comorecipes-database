name: Spanish Rice

tags:
- Mexican
- Side
- Vegetarian

measurements:
- amount: '14'
  unit: grams
  ingredient: butter
- amount: '30'
  unit: grams
  ingredient: shallots
- amount: '10'
  unit: grams
  ingredient: garlic
- amount: '210'
  unit: grams
  ingredient: brown rice
- amount: '4'
  unit: grams
  ingredient: salt and pepper
- amount: '600'
  unit: grams
  ingredient: no-chicken stock
- amount: '2'
  unit: portions
  ingredient: fresh thyme
- amount: '1.5'
  unit: grams
  ingredient: parsley

instructions:
- Melt butter over medium heat. Add shallot and garlic, saute until tender.
- Add rice and stir until glossy. Add stock and herbs, bring to boil.
- Reduce to low or simmer and let cook for 30-40 minutes until all liquid is gone.
- 'Note: Rinse the rice beforehand to make fluffier'
