name: Sweet Dough

tags:
- American
- Dessert
- Vegetarian

measurements:
- amount: '166'
  unit: grams
  ingredient: whole milk
- amount: '65'
  unit: grams
  ingredient: sugar
- amount: '5'
  unit: grams
  ingredient: yeast
- amount: '2'
  unit: portions
  ingredient: egg
  suffix: ', room temperature'
- amount: '330'
  unit: grams
  ingredient: flour
- amount: '6'
  unit: grams
  ingredient: salt
- amount: '113'
  unit: grams
  ingredient: butter

instructions:
- Heat milk to 110 F in small saucepan over medium heat.
- Stir in 1 tbsp sugar and yeast.
- Let sit for 5 minutes.
- Add eggs.
- Combine remaining dry ingredients then knead into dough.
- Let prove for 90 minutes.

notes:
- Butter should be room temperature; take out well in advance.
